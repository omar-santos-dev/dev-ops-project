<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ServiceNow User Provisioning Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eeeeee;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ServiceNow Account Provisioning</h1>

    <p>
        Lab interface for creating a user in a ServiceNow PDI.
    </p>

    <form id="userForm">

        <h2>ServiceNow Connection</h2>

        <label for="instance">
            ServiceNow Instance
        </label>

        <input
            type="text"
            id="instance"
            placeholder="https://dev123456.service-now.com"
            required
        >

        <label for="apiUsername">
            ServiceNow Username
        </label>

        <input
            type="text"
            id="apiUsername"
            required
        >

        <label for="apiPassword">
            ServiceNow Password
        </label>

        <input
            type="password"
            id="apiPassword"
            required
        >


        <h2>New User</h2>

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="jsmith"
            required
        >

        <label for="firstName">
            First Name
        </label>

        <input
            type="text"
            id="firstName"
            placeholder="John"
            required
        >

        <label for="lastName">
            Last Name
        </label>

        <input
            type="text"
            id="lastName"
            placeholder="Smith"
            required
        >

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="john.smith@example.com"
            required
        >

        <button type="submit">
            Create ServiceNow User
        </button>

    </form>

    <div id="result">
        Waiting for request...
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
