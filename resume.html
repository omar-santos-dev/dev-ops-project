
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Digital Portfolio</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <style>
    body, h1, h2, h3, h4, h5, h6 { font-family: "Montserrat", sans-serif; }
    
    /* Set the width of the sidebar to 120px */
    .w3-sidebar { width: 120px; background: #111; }
    
    /* Add a left margin to the "page content" that matches the width of the sidebar */
    #main { margin-left: 120px; }
    
    /* Remove margins from "page content" on small screens */
    @media only screen and (max-width: 600px) {
      #main { margin-left: 0; }
    }

    /* ==========================================
       Smooth Scrolling & Slide-In Transitions
       ========================================== */
    html {
      scroll-behavior: smooth;
    }

    /* 1. Header Load Animation (Slide-Down) */
    .slide-down {
      opacity: 0;
      transform: translate3d(0, -30px, 0);
      animation: slideDownOnLoad 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideDownOnLoad {
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    /* 2. Scroll Animations (Slide-Up) */
    .scroll-slide {
      opacity: 0;
      transform: translate3d(0, 50px, 0);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity; /* Optimizes browser rendering */
    }

    /* Activated via JS once scrolled into view */
    .scroll-slide.active {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    /* Interactive Portfolio Cards Styling */
    .portfolio-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
      background-color: #1e1e1e;
      border: 1px solid #2d2d2d;
      text-decoration: none;
      display: block;
    }
</head>
    <body>
    
    <div class="w3-content w3-justify w3-text-grey w3-padding-64 scroll-slide" id="about">
    <h2 class="w3-text-light-grey">Welcome to My Portfolio</h2>
    <hr style="width:200px" class="w3-opacity">
    <p>
  I’ve spent more than 18 years working with technology, starting in military
  communications and eventually moving into networking, systems administration,
  cybersecurity, and enterprise IT. Along the way, I’ve worked with everything
  from tactical communications and networking equipment to Active Directory,
  VMware, Windows and Linux systems, and secure DoD environments. What I enjoy
  most about IT is figuring out how things work. I’m the type of person who will
  build something in a lab, break it, troubleshoot it, rebuild it, and come away
  understanding it better than I did before.
</p>

<p>
  That curiosity is really what this site is about. I’m currently expanding my
  skills in ServiceNow, automation, APIs, JavaScript, and IT service management,
  while continuing to build on my systems and infrastructure background. I use
  this site as a digital workshop where I can experiment, document what I’m
  learning, and turn ideas into working projects. For me, the best way to learn
  technology has always been simple:
  <strong>build it, test it, break it, understand it, and make it better.</strong>
</p>
  </div>

    </body>
</html>
